name: build

# Layout checks on Linux, then a public macOS build (Apple silicon + Intel), on every push and pull request.
# Standard GitHub-hosted runners are free for public repositories. Also runnable by hand: Actions → build → Run workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the layout
        run: python3 scripts/check-layout.py --public
      - name: Key docs up to date
        run: python3 scripts/make-keys-doc.py && git diff --exit-code docs/keys.md docs/keys.zh-CN.md

  build:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build (public, Apple silicon + Intel)
        run: ./build.sh --public --universal --no-install
